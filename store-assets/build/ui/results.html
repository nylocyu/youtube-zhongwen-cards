<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>詞</h1>
      <button class="icon-button" type="button">⚙</button>
    </header>

    <main>
      <p class="results-summary">24 words (from the transcript)</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hanzi</th>
              <th>Pinyin</th>
              <th>English</th>
            </tr>
          </thead>
          <tbody>
            <tr><td>熱鬧</td><td>rènào</td><td>lively, bustling</td></tr>
            <tr><td>味道</td><td>wèidào</td><td>taste, flavour</td></tr>
            <tr><td>排隊</td><td>páiduì</td><td>to queue up</td></tr>
            <tr><td>推薦</td><td>tuījiàn</td><td>to recommend</td></tr>
            <tr><td>當地</td><td>dāngdì</td><td>local</td></tr>
            <tr><td>價格</td><td>jiàgé</td><td>price</td></tr>
            <tr><td>新鮮</td><td>xīnxiān</td><td>fresh</td></tr>
            <tr><td>甜點</td><td>tiándiǎn</td><td>dessert</td></tr>
            <tr><td>付款</td><td>fùkuǎn</td><td>to pay</td></tr>
          </tbody>
        </table>
      </div>
      <div class="results-actions">
        <button type="button" class="primary-button">Export as TSV</button>
        <button type="button" class="secondary-button">Regenerate</button>
      </div>
    </main>
  </body>
</html>
