<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Noto Sans CJK SC", "Liberation Sans", sans-serif;
        background: #ffffff;
        color: #0f0f0f;
      }
      .file-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px;
        border-bottom: 1px solid #e0e0e0;
      }
      .file-dot {
        width: 28px; height: 28px; border-radius: 7px;
        background: #c0392b; color: #fff;
        font-size: 10px; font-weight: 700; letter-spacing: 0.3px;
        display: flex; align-items: center; justify-content: center;
      }
      .file-name { font-size: 14px; font-weight: 500; }
      table { width: 100%; border-collapse: collapse; }
      td, th {
        padding: 10px 16px; font-size: 14px; text-align: left;
        border-bottom: 1px solid #f0f0f0; white-space: nowrap;
      }
      th {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px;
        color: #909090; font-weight: 500; padding-top: 13px; padding-bottom: 9px;
      }
      .hanzi { font-size: 16px; }
      .muted { color: #606060; }
      .foot {
        padding: 12px 16px; font-size: 12px; color: #606060;
        background: #faf9f8; border-top: 1px solid #f0f0f0;
      }
      tbody tr:last-child td { border-bottom: none; }
    </style>
  </head>
  <body>
    <div class="file-head">
      <div class="file-dot">TSV</div>
      <div class="file-name">chinese-vocab-HSK4-24.tsv</div>
    </div>
    <table>
      <thead>
        <tr><th>Hanzi</th><th>Pinyin</th><th>English</th></tr>
      </thead>
      <tbody>
        <tr><td class="hanzi">排隊</td><td class="muted">páiduì</td><td>to queue up</td></tr>
        <tr><td class="hanzi">味道</td><td class="muted">wèidào</td><td>taste, flavour</td></tr>
        <tr><td class="hanzi">推薦</td><td class="muted">tuījiàn</td><td>to recommend</td></tr>
        <tr><td class="hanzi">當地</td><td class="muted">dāngdì</td><td>local</td></tr>
        <tr><td class="hanzi">新鮮</td><td class="muted">xīnxiān</td><td>fresh</td></tr>
        <tr><td class="hanzi">價格</td><td class="muted">jiàgé</td><td>price</td></tr>
      </tbody>
    </table>
    <div class="foot">24 rows, no header · 3 more columns with example sentences</div>
  </body>
</html>
